name: Publish npm package

# Release tags publish `latest`. Every other push to main publishes a
# prerelease under the `beta` dist-tag (next patch after package.json's version
# plus `-beta.<run number>`), so QDash can pin an unreleased pi-qdash with
# `pi install npm:@oqtopus-team/pi-qdash@beta` before tagpr cuts the release.
# A tagpr release merge is skipped here because its tag publishes `latest`.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip the merge commit of a tagpr release PR; the tag it creates publishes latest.
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'tagpr-from-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Set beta version
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          # Next patch after the last release, as a prerelease: 0.1.9 -> 0.1.10-beta.<run>.
          # Sorts before any real next release, whatever bump tagpr chooses.
          current="$(node -p "require('./package.json').version")"
          IFS=. read -r major minor patch <<< "${current}"
          version="${major}.${minor}.$((patch + 1))-beta.${GITHUB_RUN_NUMBER}"
          echo "Beta version: ${version} (last release ${current})"
          npm version "${version}" --no-git-tag-version

      - name: Verify tag matches package version
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --no-tags --depth=1 origin "refs/tags/$PACKAGE_VERSION:refs/tags/$PACKAGE_VERSION"
            git diff --exit-code "$PACKAGE_VERSION" HEAD -- package.json package-lock.json README.md LICENSE extensions skills
          elif [ "$GITHUB_REF_NAME" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Publish
        run: |
          tag=latest
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then tag=beta; fi
          npm publish --access public --tag "${tag}"
